:concurrency: 5
:queues:
  - default
  - uploads
  - catalog
  - shopify_sync

:schedule:
  expire_trials:
    cron: "0 0 * * *"
    class: ExpireTrialsJob
    queue: default
    description: "Check for expired trials daily"
  expire_cancelled_subscriptions:
    cron: "0 1 * * *"
    class: ExpireCancelledSubscriptionsJob
    queue: default
    description: "Expire cancelled subscriptions after paid period ends"
  daily_catalog_sync:
    cron: "0 2 * * *"
    class: DailyCatalogSyncJob
    queue: default
    description: "Re-sync all merchant catalogs from Shopify"

:redis:
  url: <%= ENV.fetch("REDIS_URL", "redis://localhost:6379/0") %>

development:
  :concurrency: 3

production:
  :concurrency: 10

test:
  :concurrency: 1
